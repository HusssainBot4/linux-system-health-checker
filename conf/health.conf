# /opt/devopssaini/conf/health.conf
# Thresholds for health-check.sh.
# Values are percentages unless stated otherwise.

CPU_WARN=75
CPU_CRIT=90

MEM_WARN=80
MEM_CRIT=92

SWAP_WARN=20
SWAP_CRIT=50

DISK_WARN=80
DISK_CRIT=90

INODE_WARN=80
INODE_CRIT=90

# Load average is expressed per CPU core.
# 1.0 means "one core fully busy on average".
LOAD_WARN=1.5
LOAD_CRIT=2.5

# Filesystems we never want to check.
EXCLUDE_FS="tmpfs devtmpfs squashfs overlay"

# Number of processes to display in the report.
TOP_PROCESSES=5

# Where generated reports will be stored.
REPORT_DIR="/opt/devopssaini/reports"
